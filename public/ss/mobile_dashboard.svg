<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 780" width="380" height="780">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    .f-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .f-bold { font-weight: 700; }
    .f-semi { font-weight: 600; }
    .f-med  { font-weight: 500; }
    .f-reg  { font-weight: 400; }
  </style>

  <!-- Background Canvas -->
  <rect width="380" height="780" fill="#f8fafc"/>

  <!-- Top Status Bar (iOS style) -->
  <g id="statusBar">
    <text x="24" y="22" class="f-sans f-bold" font-size="12" fill="#0f172a">9:41</text>
    <!-- Cellular -->
    <path d="M 314 22 L 314 18 M 318 22 L 318 16 M 322 22 L 322 13 M 326 22 L 326 10" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
    <!-- Wifi -->
    <path d="M 336 12 C 340 9, 346 9, 350 12 M 339 15 C 342 13, 345 13, 347 15 M 343 19 A 1.5 1.5 0 1 1 343 20" stroke="#0f172a" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- Battery -->
    <rect x="356" y="11" width="18" height="10" rx="3" fill="none" stroke="#0f172a" stroke-width="1.8"/>
    <rect x="358" y="13" width="11" height="6" rx="1.5" fill="#0f172a"/>
    <path d="M 375 14 L 375 18" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- App Header -->
  <g id="appHeader" transform="translate(0, 32)">
    <rect width="380" height="52" fill="#ffffff" filter="url(#cardShadow)"/>
    <!-- StradPos Logo -->
    <g transform="translate(20, 13)">
      <rect width="26" height="26" rx="7" fill="url(#primaryGrad)"/>
      <path d="M 8 13 L 12 17 L 18 10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="34" y="18" class="f-sans f-bold" font-size="16" fill="#1e1b4b">Strad<tspan fill="#6366f1">Pos</tspan></text>
    </g>
    <!-- Branch Pill & Date -->
    <g transform="translate(225, 14)">
      <rect width="90" height="24" rx="12" fill="#e0e7ff"/>
      <circle cx="12" cy="12" r="4" fill="#4f46e5"/>
      <text x="24" y="16" class="f-sans f-semi" font-size="10.5" fill="#4338ca">Live Branch</text>
    </g>
    <!-- Avatar / Bell -->
    <circle cx="348" cy="26" r="14" fill="#f1f5f9"/>
    <path d="M 344 23 C 344 20, 352 20, 352 23 L 354 28 L 342 28 Z" fill="#64748b"/>
    <circle cx="354" cy="18" r="3.5" fill="#ef4444"/>
  </g>

  <!-- Metric Overview Cards Row -->
  <g id="metricCards" transform="translate(18, 96)">
    <!-- Card 1: Today Sales -->
    <g filter="url(#cardShadow)">
      <rect width="165" height="74" rx="12" fill="#ffffff"/>
      <rect x="0" y="0" width="4" height="74" rx="2" fill="#4f46e5"/>
      <text x="14" y="22" class="f-sans f-med" font-size="11" fill="#64748b">TODAY'S REVENUE</text>
      <text x="14" y="47" class="f-sans f-bold" font-size="19" fill="#0f172a">৳ 38,450</text>
      <rect x="14" y="54" width="56" height="14" rx="7" fill="#dcfce7"/>
      <text x="22" y="64" class="f-sans f-bold" font-size="9" fill="#15803d">▲ +16.8%</text>
    </g>

    <!-- Card 2: Orders Count -->
    <g transform="translate(178, 0)" filter="url(#cardShadow)">
      <rect width="165" height="74" rx="12" fill="#ffffff"/>
      <rect x="0" y="0" width="4" height="74" rx="2" fill="#06b6d4"/>
      <text x="14" y="22" class="f-sans f-med" font-size="11" fill="#64748b">TOTAL ORDERS</text>
      <text x="14" y="47" class="f-sans f-bold" font-size="19" fill="#0f172a">148 orders</text>
      <rect x="14" y="54" width="56" height="14" rx="7" fill="#e0f2fe"/>
      <text x="22" y="64" class="f-sans f-bold" font-size="9" fill="#0369a1">▲ +8.2%</text>
    </g>
  </g>

  <!-- Main Sales Trend Analytics Chart Card -->
  <g id="chartCard" transform="translate(18, 182)" filter="url(#cardShadow)">
    <rect width="344" height="162" rx="14" fill="#ffffff"/>
    <!-- Title & Toggle -->
    <text x="16" y="24" class="f-sans f-bold" font-size="13" fill="#1e293b">Sales & Checkout Performance</text>
    <text x="16" y="38" class="f-sans f-reg" font-size="10" fill="#94a3b8">Real-time hourly transaction rate</text>
    
    <!-- Legend -->
    <circle cx="255" cy="22" r="4" fill="#4f46e5"/>
    <text x="264" y="25" class="f-sans f-med" font-size="9.5" fill="#64748b">Current</text>
    <circle cx="305" cy="22" r="4" fill="#cbd5e1"/>
    <text x="314" y="25" class="f-sans f-med" font-size="9.5" fill="#94a3b8">Prev</text>

    <!-- Grid Lines -->
    <line x1="16" y1="60" x2="328" y2="60" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="16" y1="85" x2="328" y2="85" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="16" y1="110" x2="328" y2="110" stroke="#f1f5f9" stroke-width="1"/>
    <line x1="16" y1="135" x2="328" y2="135" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Y-labels -->
    <text x="325" y="58" class="f-sans f-med" font-size="8" fill="#94a3b8" text-anchor="end">40k</text>
    <text x="325" y="83" class="f-sans f-med" font-size="8" fill="#94a3b8" text-anchor="end">25k</text>
    <text x="325" y="108" class="f-sans f-med" font-size="8" fill="#94a3b8" text-anchor="end">10k</text>

    <!-- Previous Week Dashed Line -->
    <path d="M 20 120 Q 70 125 120 105 T 220 95 T 320 85" fill="none" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3,3"/>

    <!-- Area Fill for Active Curve -->
    <path d="M 20 135 L 20 115 C 60 110, 80 75, 120 80 C 160 85, 180 55, 230 62 C 270 68, 290 48, 325 50 L 325 135 Z" fill="url(#areaGrad)"/>

    <!-- Main Active Curve -->
    <path d="M 20 115 C 60 110, 80 75, 120 80 C 160 85, 180 55, 230 62 C 270 68, 290 48, 325 50" fill="none" stroke="url(#primaryGrad)" stroke-width="2.8" stroke-linecap="round"/>

    <!-- Data Points -->
    <circle cx="120" cy="80" r="3.5" fill="#4f46e5" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="230" cy="62" r="3.5" fill="#4f46e5" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="325" cy="50" r="4.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>

    <!-- Highlight Tooltip Pill -->
    <g transform="translate(200, 32)">
      <rect width="60" height="20" rx="6" fill="#1e1b4b"/>
      <text x="30" y="14" class="f-sans f-bold" font-size="9" fill="#ffffff" text-anchor="middle">৳ 38,450</text>
    </g>

    <!-- X-Labels -->
    <text x="24" y="148" class="f-sans f-med" font-size="8.5" fill="#94a3b8">10 AM</text>
    <text x="80" y="148" class="f-sans f-med" font-size="8.5" fill="#94a3b8">12 PM</text>
    <text x="140" y="148" class="f-sans f-med" font-size="8.5" fill="#94a3b8">2 PM</text>
    <text x="200" y="148" class="f-sans f-med" font-size="8.5" fill="#94a3b8">4 PM</text>
    <text x="260" y="148" class="f-sans f-med" font-size="8.5" fill="#94a3b8">6 PM</text>
    <text x="315" y="148" class="f-sans f-med" font-size="8.5" fill="#94a3b8">Now</text>
  </g>

  <!-- Donut Distribution Row (Payment & Category) -->
  <g id="donutRow" transform="translate(18, 356)">
    <!-- Card 1: Payment Methods -->
    <g filter="url(#cardShadow)">
      <rect width="165" height="124" rx="12" fill="#ffffff"/>
      <text x="14" y="20" class="f-sans f-bold" font-size="11.5" fill="#1e293b">Payment Modes</text>
      <!-- Donut Graphic -->
      <g transform="translate(48, 68)">
        <circle cx="0" cy="0" r="28" fill="none" stroke="#e2e8f0" stroke-width="9"/>
        <!-- Card 62% -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#4f46e5" stroke-width="9" stroke-dasharray="109 176" stroke-dashoffset="44" stroke-linecap="round"/>
        <!-- Cash 25% -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#06b6d4" stroke-width="9" stroke-dasharray="44 176" stroke-dashoffset="-70" stroke-linecap="round"/>
        <!-- MFS 13% -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#10b981" stroke-width="9" stroke-dasharray="23 176" stroke-dashoffset="-118" stroke-linecap="round"/>
        <text x="0" y="4" class="f-sans f-bold" font-size="10" fill="#0f172a" text-anchor="middle">62%</text>
      </g>
      <!-- Mini Legends -->
      <g transform="translate(95, 42)">
        <circle cx="4" cy="6" r="3" fill="#4f46e5"/>
        <text x="12" y="9" class="f-sans f-med" font-size="8.5" fill="#475569">Card / POS</text>
        <circle cx="4" cy="24" r="3" fill="#06b6d4"/>
        <text x="12" y="27" class="f-sans f-med" font-size="8.5" fill="#475569">Cash</text>
        <circle cx="4" cy="42" r="3" fill="#10b981"/>
        <text x="12" y="45" class="f-sans f-med" font-size="8.5" fill="#475569">bKash/QR</text>
      </g>
    </g>

    <!-- Card 2: Top Categories -->
    <g transform="translate(178, 0)" filter="url(#cardShadow)">
      <rect width="165" height="124" rx="12" fill="#ffffff"/>
      <text x="14" y="20" class="f-sans f-bold" font-size="11.5" fill="#1e293b">Categories</text>
      <!-- Donut Graphic -->
      <g transform="translate(48, 68)">
        <circle cx="0" cy="0" r="28" fill="none" stroke="#e2e8f0" stroke-width="9"/>
        <!-- Grocery 55% -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#f59e0b" stroke-width="9" stroke-dasharray="96 176" stroke-dashoffset="44" stroke-linecap="round"/>
        <!-- Bakery 30% -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#ec4899" stroke-width="9" stroke-dasharray="52 176" stroke-dashoffset="-56" stroke-linecap="round"/>
        <!-- Drinks 15% -->
        <circle cx="0" cy="0" r="28" fill="none" stroke="#8b5cf6" stroke-width="9" stroke-dasharray="26 176" stroke-dashoffset="-112" stroke-linecap="round"/>
        <text x="0" y="4" class="f-sans f-bold" font-size="10" fill="#0f172a" text-anchor="middle">55%</text>
      </g>
      <!-- Mini Legends -->
      <g transform="translate(95, 42)">
        <circle cx="4" cy="6" r="3" fill="#f59e0b"/>
        <text x="12" y="9" class="f-sans f-med" font-size="8.5" fill="#475569">Retail</text>
        <circle cx="4" cy="24" r="3" fill="#ec4899"/>
        <text x="12" y="27" class="f-sans f-med" font-size="8.5" fill="#475569">Bakery</text>
        <circle cx="4" cy="42" r="3" fill="#8b5cf6"/>
        <text x="12" y="45" class="f-sans f-med" font-size="8.5" fill="#475569">Drinks</text>
      </g>
    </g>
  </g>

  <!-- Recent Completed Invoices / Orders List -->
  <g id="recentOrders" transform="translate(18, 492)" filter="url(#cardShadow)">
    <rect width="344" height="210" rx="14" fill="#ffffff"/>
    <text x="16" y="24" class="f-sans f-bold" font-size="12.5" fill="#1e293b">Recent POS Checkouts</text>
    <text x="328" y="24" class="f-sans f-bold" font-size="10" fill="#4f46e5" text-anchor="end">View All</text>

    <!-- Item 1 -->
    <g transform="translate(16, 38)">
      <circle cx="16" cy="16" r="16" fill="#e0e7ff"/>
      <path d="M 11 16 L 15 20 L 22 12" stroke="#4338ca" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="42" y="14" class="f-sans f-semi" font-size="11" fill="#0f172a">Order #1042 • Walk-in</text>
      <text x="42" y="26" class="f-sans f-reg" font-size="9" fill="#94a3b8">3 Items • 2 mins ago</text>
      <text x="312" y="16" class="f-sans f-bold" font-size="12" fill="#0f172a" text-anchor="end">৳ 288.00</text>
      <rect x="272" y="21" width="40" height="12" rx="6" fill="#dcfce7"/>
      <text x="292" y="30" class="f-sans f-bold" font-size="7.5" fill="#15803d" text-anchor="middle">PAID</text>
      <line x1="0" y1="36" x2="312" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Item 2 -->
    <g transform="translate(16, 82)">
      <circle cx="16" cy="16" r="16" fill="#e0f2fe"/>
      <path d="M 11 16 L 15 20 L 22 12" stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="42" y="14" class="f-sans f-semi" font-size="11" fill="#0f172a">Order #1041 • Table 4</text>
      <text x="42" y="26" class="f-sans f-reg" font-size="9" fill="#94a3b8">5 Items • 6 mins ago</text>
      <text x="312" y="16" class="f-sans f-bold" font-size="12" fill="#0f172a" text-anchor="end">৳ 1,450.00</text>
      <rect x="272" y="21" width="40" height="12" rx="6" fill="#dcfce7"/>
      <text x="292" y="30" class="f-sans f-bold" font-size="7.5" fill="#15803d" text-anchor="middle">PAID</text>
      <line x1="0" y1="36" x2="312" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Item 3 -->
    <g transform="translate(16, 126)">
      <circle cx="16" cy="16" r="16" fill="#fef3c7"/>
      <path d="M 11 16 L 15 20 L 22 12" stroke="#d97706" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="42" y="14" class="f-sans f-semi" font-size="11" fill="#0f172a">Order #1040 • Due Sale</text>
      <text x="42" y="26" class="f-sans f-reg" font-size="9" fill="#94a3b8">Customer: Mansib • 12m ago</text>
      <text x="312" y="16" class="f-sans f-bold" font-size="12" fill="#0f172a" text-anchor="end">৳ 620.00</text>
      <rect x="272" y="21" width="40" height="12" rx="6" fill="#fef3c7"/>
      <text x="292" y="30" class="f-sans f-bold" font-size="7.5" fill="#b45309" text-anchor="middle">PARTIAL</text>
      <line x1="0" y1="36" x2="312" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    </g>

    <!-- Item 4 -->
    <g transform="translate(16, 170)">
      <circle cx="16" cy="16" r="16" fill="#e0e7ff"/>
      <path d="M 11 16 L 15 20 L 22 12" stroke="#4338ca" stroke-width="2" stroke-linecap="round" fill="none"/>
      <text x="42" y="14" class="f-sans f-semi" font-size="11" fill="#0f172a">Order #1039 • Barcode Scan</text>
      <text x="42" y="26" class="f-sans f-reg" font-size="9" fill="#94a3b8">1 Item • 18 mins ago</text>
      <text x="312" y="16" class="f-sans f-bold" font-size="12" fill="#0f172a" text-anchor="end">৳ 85.00</text>
      <rect x="272" y="21" width="40" height="12" rx="6" fill="#dcfce7"/>
      <text x="292" y="30" class="f-sans f-bold" font-size="7.5" fill="#15803d" text-anchor="middle">PAID</text>
    </g>
  </g>

  <!-- Bottom App Navigation Tab Bar -->
  <g id="bottomNav" transform="translate(0, 716)">
    <rect width="380" height="64" fill="#ffffff" filter="url(#cardShadow)"/>
    <line x1="0" y1="0" x2="380" y2="0" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Tab 1: Dashboard (Active) -->
    <g transform="translate(38, 12)">
      <circle cx="12" cy="10" r="14" fill="#e0e7ff"/>
      <rect x="6" y="5" width="5" height="5" rx="1" fill="#4f46e5"/>
      <rect x="13" y="5" width="5" height="5" rx="1" fill="#4f46e5"/>
      <rect x="6" y="12" width="5" height="5" rx="1" fill="#4f46e5"/>
      <rect x="13" y="12" width="5" height="5" rx="1" fill="#4f46e5"/>
      <text x="12" y="34" class="f-sans f-bold" font-size="9" fill="#4f46e5" text-anchor="middle">Overview</text>
    </g>

    <!-- Tab 2: POS Cart -->
    <g transform="translate(125, 12)">
      <path d="M 6 8 L 9 8 L 12 18 L 20 18 L 22 11 L 10 11 M 12 21 A 1.5 1.5 0 1 1 12 22 M 19 21 A 1.5 1.5 0 1 1 19 22" stroke="#64748b" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <text x="14" y="34" class="f-sans f-med" font-size="9" fill="#64748b" text-anchor="middle">POS Cart</text>
    </g>

    <!-- Tab 3: Sales Report -->
    <g transform="translate(215, 12)">
      <path d="M 7 19 L 11 14 L 15 17 L 21 9 M 18 9 L 21 9 L 21 12" stroke="#64748b" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="14" y="34" class="f-sans f-med" font-size="9" fill="#64748b" text-anchor="middle">Reports</text>
    </g>

    <!-- Tab 4: Settings -->
    <g transform="translate(305, 12)">
      <circle cx="12" cy="14" r="4" stroke="#64748b" stroke-width="1.6" fill="none"/>
      <path d="M 12 6 L 12 8 M 12 20 L 12 22 M 4 14 L 6 14 M 18 14 L 20 14" stroke="#64748b" stroke-width="1.6" stroke-linecap="round"/>
      <text x="12" y="34" class="f-sans f-med" font-size="9" fill="#64748b" text-anchor="middle">Settings</text>
    </g>
  </g>
</svg>
